<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="none" stroke="#27272a" stroke-width="3"/>

  <g opacity="0.08">
    <circle cx="80" cy="80" r="3" fill="#ffffff"/>
    <circle cx="160" cy="80" r="3" fill="#ffffff"/>
    <circle cx="240" cy="80" r="3" fill="#ffffff"/>
    <circle cx="320" cy="80" r="3" fill="#ffffff"/>
    <circle cx="400" cy="80" r="3" fill="#ffffff"/>
    <circle cx="80" cy="160" r="3" fill="#ffffff"/>
    <circle cx="400" cy="160" r="3" fill="#ffffff"/>
    <circle cx="80" cy="240" r="3" fill="#ffffff"/>
    <circle cx="400" cy="240" r="3" fill="#ffffff"/>
    <circle cx="80" cy="320" r="3" fill="#ffffff"/>
    <circle cx="400" cy="320" r="3" fill="#ffffff"/>
    <circle cx="80" cy="400" r="3" fill="#ffffff"/>
    <circle cx="160" cy="400" r="3" fill="#ffffff"/>
    <circle cx="240" cy="400" r="3" fill="#ffffff"/>
    <circle cx="320" cy="400" r="3" fill="#ffffff"/>
    <circle cx="400" cy="400" r="3" fill="#ffffff"/>
  </g>

  <g filter="url(#glow)">
    <path d="M 296 96 L 176 280 L 248 280 L 216 416 L 336 232 L 264 232 Z"
          fill="url(#redGrad)" stroke="#fca5a5" stroke-width="2" stroke-linejoin="round"/>
  </g>

  <g transform="translate(110, 360)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="44" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <ellipse cx="0" cy="0" rx="44" ry="16" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <ellipse cx="0" cy="0" rx="16" ry="44" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#ef4444" stroke-width="2.5"/>
  </g>

  <g transform="translate(400, 96)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="36" fill="#dc2626"/>
    <text x="0" y="6" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" font-weight="900" fill="#ffffff">24/7</text>
  </g>

  <g transform="translate(112, 112)" opacity="0.9">
    <text x="0" y="0" text-anchor="middle" font-family="Inter, monospace" font-size="42" font-weight="900" fill="#3f3f46">&lt;/&gt;</text>
  </g>
</svg>
